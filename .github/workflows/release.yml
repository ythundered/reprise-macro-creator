name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest supported runner, so the binary works on older glibc too
          - { os: ubuntu-22.04, asset: reprise-macro-creator-linux-x86_64 }
          - { os: windows-latest, asset: reprise-macro-creator-windows-x64.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y grim slurp libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 libxcb-cursor0
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --distpath dist --workpath build packaging/reprise.spec
      - name: start the linux build with nothing else on the path
        if: runner.os == 'Linux'
        run: |
          mv dist/reprise-macro-creator "dist/${{ matrix.asset }}"
          sudo apt-get remove -y grim slurp
          QT_QPA_PLATFORM=offscreen "dist/${{ matrix.asset }}" --smoke-test smoke.json
          cat smoke.json
          python packaging/check_smoke.py smoke.json
      - name: start the windows build
        if: runner.os == 'Windows'
        run: |
          Move-Item dist/reprise-macro-creator.exe "dist/${{ matrix.asset }}"
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist/${{ matrix.asset }}" -ArgumentList "--smoke-test","smoke.json" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          Get-Content smoke.json
          python packaging/check_smoke.py smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --title "$GITHUB_REF_NAME" --notes-file packaging/release-notes.md
